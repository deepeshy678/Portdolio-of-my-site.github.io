<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="fire">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Dipesh Yadav</title>
  <meta name="description" content="Read articles, tutorials and insights by Dipesh Yadav." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128293;</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Scroll progress bar -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-flame"></div>
    <span>DY</span>
  </div>

  <!-- Navbar (same as home page) -->
  <header class="navbar" id="navbar">
    <nav class="nav container">
      <a href="index.html#home" class="logo"><span class="logo-flame"></span> Dipesh <span class="logo-dot"></span></a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#home" class="nav-link">Home</a></li>
        <li><a href="index.html#about" class="nav-link">About</a></li>
        <li><a href="index.html#skills" class="nav-link">Skills</a></li>
        <li><a href="index.html#projects" class="nav-link">Projects</a></li>
        <li><a href="index.html#blog" class="nav-link active">Blog</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-tools">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">
          <span class="icon-sun">&#9728;</span>
          <span class="icon-moon">&#9790;</span>
          <span class="toggle-thumb"></span>
        </button>

        <div class="color-picker" id="colorPicker">
          <button class="color-picker-btn" id="colorPickerBtn" aria-label="Change accent color">
            <span class="color-drop"></span>
          </button>
          <div class="color-menu" id="colorMenu">
            <span class="color-menu-title">Accent Color</span>
            <button class="color-swatch" data-color="fire" style="--swatch:#ff3d2e" title="Fiery Red"></button>
            <button class="color-swatch" data-color="rose" style="--swatch:#ff4d88" title="Rose"></button>
            <button class="color-swatch" data-color="blue" style="--swatch:#3d7bff" title="Blue"></button>
            <button class="color-swatch" data-color="forest" style="--swatch:#2ec98a" title="Forest"></button>
            <button class="color-swatch" data-color="violet" style="--swatch:#9b5cff" title="Violet"></button>
            <button class="color-swatch" data-color="amber" style="--swatch:#ffa03d" title="Amber"></button>
          </div>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ================= BLOG ARTICLE ================= -->

  <main class="blog-page">

    <div class="container">

      <!-- Back to Blog -->
      <a href="index.html#blog" class="blog-back">
        ← Back to Blog
      </a>

      <!-- Loading message -->
      <div id="blogLoading" class="blog-loading">
        Loading blog...
      </div>

      <!-- Error message -->
      <div id="blogError" class="blog-error" style="display: none;">
        Blog post could not be found.
      </div>

      <!-- Blog Content -->
      <article id="blogArticle" class="single-blog" style="display: none;">

        <!-- Category + Date -->
        <div class="single-blog-meta">
          <span id="blogCategory" class="blog-tag"></span>
          <span id="blogDate" class="blog-date"></span>
        </div>

        <!-- Title -->
        <h1 id="blogTitle" class="single-blog-title"></h1>

        <!-- Excerpt -->
        <p id="blogExcerpt" class="single-blog-excerpt"></p>

        <!-- Featured Image -->
        <img id="blogImage" class="single-blog-image" src="" alt="" style="display: none;">

        <!-- Full Content -->
        <div id="blogContent" class="single-blog-content"></div>

      </article>

    </div>

  </main>

  <!-- Footer (same as home page) -->
  <footer class="footer">
    <div class="container footer-inner">
      <a href="index.html#home" class="logo"><span class="logo-flame">&</span> dipesh<span class="logo-dot">.</span>dev</a>
      <p>&copy; <span id="year"></span> Dipesh Yadav. All Copyrights Reserved</p>
      <a href="index.html#home" class="back-top" aria-label="Back to top">&#8593;</a>
    </div>
  </footer>

  <!-- ================= SUPABASE + SITE SCRIPT ================= -->
  <!-- script.js creates the shared supabaseClient and wires up the
       navbar (theme toggle, color picker, hamburger menu, scroll progress). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <!-- ================= SINGLE BLOG LOADER ================= -->
  <script>

    /* Uses the `supabaseClient` already created by script.js —
       do NOT redeclare it here, or the page will throw a
       "already declared" error since both scripts share the
       same top-level scope. */

    /* ==========================================
       GET BLOG SLUG FROM URL
    ========================================== */

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get("slug");

    /* ==========================================
       GET HTML ELEMENTS
    ========================================== */

    const blogLoading = document.getElementById("blogLoading");
    const blogError = document.getElementById("blogError");
    const blogArticle = document.getElementById("blogArticle");
    const blogCategory = document.getElementById("blogCategory");
    const blogDate = document.getElementById("blogDate");
    const blogTitle = document.getElementById("blogTitle");
    const blogExcerpt = document.getElementById("blogExcerpt");
    const blogImage = document.getElementById("blogImage");
    const blogContent = document.getElementById("blogContent");

    /* ==========================================
       LOAD BLOG
    ========================================== */

    async function loadBlog() {

      if (!slug) {
        showError();
        return;
      }

      const { data, error } = await supabaseClient
        .from("blogs")
        .select("*")
        .eq("slug", slug)
        .eq("published", true)
        .single();

      if (error || !data) {
        console.error("Blog loading error:", error);
        showError();
        return;
      }

      /* DISPLAY BLOG DATA */

      blogCategory.textContent = data.category || "";

      blogDate.textContent = new Date(data.created_at).toLocaleDateString(
        "en-US",
        { month: "short", day: "numeric", year: "numeric" }
      );

      blogTitle.textContent = data.title || "";
      blogExcerpt.textContent = data.excerpt || "";

      if (data.image) {
        blogImage.src = data.image;
        blogImage.alt = data.title || "Blog image";
        blogImage.style.display = "block";
      }

      blogContent.innerHTML = data.content || "";

      blogLoading.style.display = "none";
      blogArticle.style.display = "block";

      document.title = data.title + " | Dipesh Yadav";
    }

    /* ==========================================
       SHOW ERROR
    ========================================== */

    function showError() {
      blogLoading.style.display = "none";
      blogError.style.display = "block";
    }

    /* ==========================================
       START
    ========================================== */

    loadBlog();

  </script>

</body>
</html>
